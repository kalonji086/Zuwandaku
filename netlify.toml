[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[build.cache]
  directories = ["node_modules/.cache", ".next/cache"]

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect API calls to backend
[[redirects]]
  from = "/backend/*"
  to = "https://zuwandaku-backend-holy-glitter-298.fly.dev/api/:splat"
  status = 200
  force = true

